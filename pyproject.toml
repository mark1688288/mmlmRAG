[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragcli"
dynamic = ["version"]
description = "本機混合語言 RAG CLI"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# AGPL-3.0-only matches PyMuPDF. An Artifex commercial license is the other
# way to distribute a build that includes PyMuPDF.
# chromadb stays pinned at 1.5.9; upgrading it is a deliberate change.
dependencies = [
    "chromadb==1.5.9",
    "httpx",
    "pymupdf",
    "python-docx",
    "python-pptx",
    "ocrmac",
    "pillow",
    "pillow-heif",
    "charset-normalizer",
]

[project.urls]
Homepage = "https://github.com/mark1688288/mmlmRAG"
Source = "https://github.com/mark1688288/mmlmRAG"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rag = "ragcli.cli:console_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ragcli.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live loopback Ollama; skipped unless RAG_INTEGRATION=1",
]
