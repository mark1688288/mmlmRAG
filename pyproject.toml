[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ragcli"
dynamic = ["version"]
description = "本機混合語言 RAG CLI"
requires-python = ">=3.13"
# pymupdf is AGPL-3.0. Acceptable for a personal tool that stays on this Mac
# and is not distributed. Replace the PDF parser before packaging it for anyone else.
# chromadb stays pinned at 1.5.9; upgrading it is a deliberate change.
dependencies = [
    "chromadb==1.5.9",
    "httpx",
    "pymupdf",
    "python-docx",
    "python-pptx",
    "ocrmac",
    "pillow",
    "pillow-heif",
    "charset-normalizer",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rag = "ragcli.cli:console_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ragcli.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
